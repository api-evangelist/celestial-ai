aid: celestial-ai
name: Celestial AI
description: 'Celestial AI was a Santa Clara, California silicon-photonics company and the
  creator of the Photonic Fabric optical interconnect technology platform, which replaces
  electrical links between compute and memory with light in order to scale AI accelerators
  within a package, package-to-package, and across racks. The company raised more than $515
  million across Series B and Series C rounds and introduced the Photonic Fabric Module, an
  SoC carrying optical interconnect in the middle of the silicon die. Marvell Technology
  completed its acquisition of Celestial AI on 2 February 2026 in a cash-and-stock deal
  reported at approximately $3.25 billion; the technology and team were folded into Marvell''s
  Data Center Group and Celestial AI no longer operates as an independent entity. Its product
  was semiconductor hardware and IP sold to hyperscalers and accelerator vendors, not software,
  and it never published a developer program, public API, SDK, or machine-readable API contract.'
